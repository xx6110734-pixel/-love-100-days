<style>
:root{--rose:#f3a4bc;--gold:#e8ca91;--ink:#fff8fb;--muted:#dacbd2;--line:rgba(255,255,255,.15);--panel:#fff9fb}

.panel{position:fixed;right:0;top:0;width:min(540px,100%);height:100dvh;z-index:60;padding:18px;background:var(--panel);color:#4f3c46;transform:translateX(105%);transition:transform .26s ease;overflow:auto;overscroll-behavior:contain;box-shadow:-25px 0 70px rgba(0,0,0,.35)}.panel.open{transform:none}.panel-head{position:sticky;top:-18px;background:var(--panel);z-index:3;padding:12px 0;display:flex;align-items:center;justify-content:space-between}.panel h3{margin:0}.close{border:0;background:none;font-size:2rem}.tabs{display:flex;gap:6px;position:sticky;top:47px;background:var(--panel);z-index:2;padding:8px 0 12px}.tabs button{flex:1;border:0;border-radius:10px;padding:9px 5px;background:#eee1e6;color:#5d4652}.tabs button.active{background:#c97891;color:#fff}.tab{display:none}.tab.active{display:block}.panel label{display:block;margin:14px 0 7px;font-weight:700;font-size:.9rem}.panel input[type=text],.panel input[type=date],.panel textarea,.panel select{width:100%;border:1px solid #e7d8de;border-radius:13px;padding:11px 12px;background:#fff;color:#4f3c46}.panel textarea{min-height:84px;resize:vertical}.upload,.editor-card{border:1px solid #e5d4dc;border-radius:15px;padding:13px;background:#fff;margin-top:10px}.editor-card h4{margin:0 0 8px}.bilingual-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:14px;padding:12px;margin-top:10px;font-weight:700;background:#c97891;color:#fff}.btn.dark{background:#59424f}.btn.light{background:#eee1e6;color:#5d4652}.btn.danger{background:#9b4f5f}.hint{font-size:.79rem;line-height:1.55;color:#8a7480;margin-top:7px}.asset-list{display:grid;gap:8px;margin-top:10px}.asset-row{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid #eadbe1;border-radius:13px;padding:8px}.asset-row img{width:54px;height:54px;object-fit:cover;border-radius:9px}.asset-row .meta{min-width:0}.asset-row input{padding:7px!important;font-size:.82rem!important}.mini .start-overlay{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:radial-gradient(circle at center,#4a263d,#120a13 70%);transition:opacity .65s,visibility .65s}.start-overlay.hide{opacity:0;visibility:hidden;pointer-events:none}.opener{text-align:center;padding:34px;cursor:pointer}.seal{width:112px;height:112px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:3.2rem;background:radial-gradient(circle at 35% 30%,#ffcad9,#b94e70);box-shadow:0 0 0 12px rgba(255,255,255,.05),0 0 58px rgba(242,168,189,.42)}.opener p{letter-spacing:.12em;color:#ead7df}
.lightbox{position:fixed;inset:0;z-index:110;background:rgba(7,4,8,.94);display:none;align-items:center;justify-content:center;padding:18px}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:82dvh;object-fit:contain;border-radius:16px}.lightbox-close{position:absolute;right:18px;top:max(18px,env(safe-area-inset-top));width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:1.7rem}.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:45px;height:58px;border:0;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-size:2rem}.lightbox-prev{left:10px}.lightbox-next{right:10px}.lightbox-caption{position:absolute;left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;color:#fff;white-space:pre-line}
.project-mode{overflow:hidden}.project-mode .slide{display:none;position:fixed;inset:0;min-height:100dvh;padding:3vh 3vw}.project-mode .slide.active{display:flex;content-visibility:visible}.project-mode .fabbar,.project-mode .music-status,.project-mode .music-control{display:none!important}.project-controls{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;gap:7px;padding:7px;border-radius:999px;background:rgba(14,8,15,.82)}.project-mode .project-controls{display:flex}.project-controls button{border:0;border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.1);color:#fff}
@media(max-width:720px){#aurora{filter:blur(62px);opacity:.18;animation-duration:40s}.glass{border-radius:25px;padding:28px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.slide{padding:24px 11px 90px}.photo-main{width:min(var(--cover-width,98%),100%);height:var(--cover-height-mobile,520px)}.gallery{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;max-height:68vh}.gallery-card{border-radius:7px}.music-status{top:max(8px,env(safe-area-inset-top));max-width:70vw}#musicBtn{left:8px;bottom:max(8px,env(safe-area-inset-bottom))}#prevTrack{left:7px}#nextTrack{right:7px}.fabbar{right:7px;bottom:max(7px,env(safe-area-inset-bottom))}.fab{padding:10px 12px}.panel{padding:14px}.asset-row{grid-template-columns:46px 1fr}.asset-row img{width:46px;height:46px}.asset-row .mini{grid-column:1/-1;justify-content:flex-end}.bilingual-grid{grid-template-columns:1fr}.title{font-size:clamp(2.8rem,15vw,5rem)}}

<body>
<div id="aurora"></div><div id="particles"></div>
<div class="start-overlay" id="startOverlay"><div class="opener" id="openStory" role="button" tabindex="0"><div class="seal">❤</div><h2 id="openTitle"></h2><p id="openHint"></p></div></div>

<section class="slide"><div class="content"><div class="glass"><h2 id="vPeriodTitle"></h2><p class="copy" id="vPeriod"></p><div class="photo-main" id="coverFrame"></div></div></div></section>
<section class="slide"><div class="content"><div class="glass"><h2 id="vTitle1"></h2><p class="copy" id="vText1"></p></div></div></section>
<section class="slide"><div class="content"><div class="glass"><h2 id="vTitle2"></h2><p class="copy" id="vText2"></p></div></div></section>
<section class="slide"><div class="content"><div class="glass"><h2 id="vTitle3"></h2><p class="copy" id="vText3"></p></div></div></section>
<section class="slide"><div class="content"><div class="glass"><h2 id="vTitle4"></h2><p class="copy" id="vText4"></p></div></div></section>
<section class="slide"><div class="content"><div class="glass"><h2 id="vTitle5"></h2><p class="copy" id="vText5"></p></div></div></section>
<section class="slide"><div class="content"><div class="glass"><div class="gallery-head"><h2 id="vGalleryTitle"></h2><span class="photo-count" id="photoCount"></span></div><p class="copy" id="vGalleryDesc"></p><div class="gallery" id="gallery"></div></div></div></section>
<section class="slide"><div class="content"><div class="glass"><div style="font-size:5rem">❤</div><h2 id="vEndTitle"></h2><p class="copy" id="vEndText"></p></div></div></section>
<div class="music-status" id="nowPlaying">音乐未开始</div><button class="music-control" id="prevTrack" aria-label="上一首">‹</button><button class="music-control" id="musicBtn" aria-label="播放或暂停">▶</button><button class="music-control" id="nextTrack" aria-label="下一首">›</button><div id="youtubePlayerWrap"><div id="youtubePlayer"></div></div>
<div class="fabbar"><button class="fab lang-btn" id="langToggle">ไทย</button><button class="fab" id="projectStart">投屏</button><button class="fab" id="openEditor">编辑</button></div>
<div class="project-controls"><button id="prevSlide">‹</button><button id="autoSlide">▶</button><span id="slideCounter">1 / 9</span><button id="nextSlide">›</button><button id="exitProject">退出</button></div>

<div class="tab active" id="textTab"><div class="hint">中文和泰语分别保存。切换网站语言时，只显示对应语言。泰语内容可由你确认后手动填写，避免机器翻译改变语气。</div><div id="textEditors"></div><button class="btn" id="saveText">保存全部双语文字</button></div>
<div class="tab" id="photoTab"><label>封面主照片</label><div class="upload"><input type="file" id="coverUpload" accept="image/*"></div><div class="editor-card"><h4>封面照片显示调节</h4><label>宽度 <span id="coverWidthValue"></span></label><input type="range" id="coverWidth" min="60" max="100" step="1"><label>手机端高度 <span id="coverHeightValue"></span></label><input type="range" id="coverHeight" min="260" max="760" step="10"><label>圆角 <span id="coverRadiusValue"></span></label><input type="range" id="coverRadius" min="0" max="50" step="1"><label>缩放 <span id="coverScaleValue"></span></label><input type="range" id="coverScale" min="100" max="190" step="1"><label>水平位置 <span id="coverXValue"></span></label><input type="range" id="coverX" min="0" max="100" step="1"><label>垂直位置 <span id="coverYValue"></span></label><input type="range" id="coverY" min="0" max="100" step="1"><button class="btn light" id="resetCoverStyle">恢复默认尺寸</button></div><label>唯一照片墙</label><div class="upload"><input type="file" id="galleryUpload" accept="image/*" multiple><div class="hint">手机端以小照片平铺。最多 120 张；点击照片可放大并左右滑动。</div></div><div class="asset-list" id="photoManager"></div></div>
<div class="tab" id="musicTab"><div class="editor-card"><h4>内置音乐库</h4><div class="hint">网站已接入 5 首中文恋爱歌曲的 YouTube 官方播放器。音乐不会储存在你的网页中；访客第一次播放时需要轻触播放键。部分地区或版权设置可能导致个别歌曲无法嵌入。你仍可添加自己拥有使用权的音频。</div></div><label>添加多首歌曲</label><div class="upload"><input type="file" id="musicUpload" accept="audio/*" multiple></div><label>播放模式</label><select id="playMode"><option value="sequence">顺序循环</option><option value="shuffle">随机播放</option><option value="single">单曲循环</option></select><div class="asset-list" id="musicManager"></div></div>

</aside><div class="toast" id="toast"></div>
<script>

let slideIndex=0,slideTimer=null;function showSlide(i){slideIndex=(i+slides.length)%slides.length;slides.forEach((s,n)=>s.classList.toggle('active',n===slideIndex));$('slideCounter').textContent=`${slideIndex+1} / ${slides.length}`}async function enterProject(){document.body.classList.add('project-mode');$('panel').classList.remove('open');showSlide(0);try{await document.documentElement.requestFullscreen?.()}catch{}}function exitProject(){document.body.classList.remove('project-mode');clearInterval(slideTimer);slideTimer=null;document.exitFullscreen?.().catch(()=>{})}$('projectStart').onclick=enterProject;$('projectFromEditor').onclick=enterProject;$('exitProject').onclick=exitProject;$('prevSlide').onclick=()=>showSlide(slideIndex-1);$('nextSlide').onclick=()=>showSlide(slideIndex+1);$('autoSlide').onclick=()=>{if(slideTimer){clearInterval(slideTimer);slideTimer=null;$('autoSlide').textContent='▶'}else{slideTimer=setInterval(()=>showSlide(slideIndex+1),8500);$('autoSlide').textContent='Ⅱ'}};
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}$('exportBackup').onclick=async()=>downloadBlob(new Blob([JSON.stringify({version:6,data,assets:await all()},null,2)],{type:'application/json'}),'恋爱纪念馆_完整备份.json');$('importBackupBtn').onclick=()=>$('importBackup').click();$('importBackup').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());data=d.data||clone(defaults);saveData();await clearAll();for(const x of d.assets||[])await put(x);location.reload()}catch{alert('备份文件无效')}};$('reset').onclick=async()=>{if(!confirm('确定清空所有文字、照片和音乐吗？'))return;localStorage.removeItem('love_museum_v6');localStorage.removeItem('love_museum_v5');await clearAll();location.reload()};
const particleCount=matchMedia('(max-width:720px)').matches?8:14;for(let i=0;i<particleCount;i++){const s=document.createElement('span');s.className='particle';s.textContent=i%4?'·':'♡';s.style.left=Math.random()*100+'vw';s.style.animationDuration=14+Math.random()*18+'s';s.style.animationDelay=-Math.random()*22+'s';s.style.fontSize=10+Math.random()*22+'px';$('particles').appendChild(s)}
